name: tests

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in scripts/*.sh scripts/lib/*.sh tests/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck -x --severity=warning scripts/*.sh scripts/lib/*.sh tests/*.sh tests/stubs/*

  integration:
    needs: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Debian 12 is still supported; run it locally with DEBIAN_RELEASE=bookworm.
      - name: Install and exercise the mail server in Debian 13
        run: bash tests/integration.sh
        env:
          DEBIAN_RELEASE: trixie
